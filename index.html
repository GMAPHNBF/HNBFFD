<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HNB Finance - LKR to Words</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        :root{
            --hnb-blue:#1676aa; --hnb-dark:#0a5480; --hnb-green:#6fa83a;
            --hnb-tx:#14213d; --hnb-mu:#5d6b82; --hnb-bd:#dbe6ef; --hnb-bd2:#8fa3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #14213d;
            background-color: #ffffff;
            background-image:
                radial-gradient(560px 380px at 8% 6%, rgba(37,170,225,0.22), transparent 70%),
                radial-gradient(600px 400px at 94% 12%, rgba(127,182,63,0.20), transparent 70%),
                radial-gradient(700px 460px at 50% 100%, rgba(37,170,225,0.14), transparent 70%);
            background-attachment: fixed;
        }

        .container { width: 100%; max-width: 620px; }

        /* ============ GLASS CARD ============ */
        .card {
            background: linear-gradient(150deg, rgba(255,255,255,0.86), rgba(255,255,255,0.58));
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            backdrop-filter: blur(16px) saturate(160%);
            border: 1.5px solid rgba(255,255,255,0.95);
            box-shadow: 0 12px 32px rgba(14,88,128,0.14), 0 2px 6px rgba(15,23,42,0.06), inset 0 1px 0 #fff;
            border-radius: 36px;
            padding: 36px 34px 30px;
            position: relative;
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 20px 50px rgba(14,88,128,0.20), 0 4px 10px rgba(15,23,42,0.08), inset 0 1px 0 #fff;
        }

        /* ============ HEADER ============ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        /* ============ HNB FINANCE LOGO (with popup) ============ */
        .hnb-logo-wrap{ position: relative; display: inline-block; flex-shrink: 0; }
        .hnb-logo{
            display: inline-flex; align-items: center; gap: 2px;
            padding: 7px 16px 7px 14px; border-radius: 13px;
            background: linear-gradient(150deg, rgba(255,255,255,0.96), rgba(240,248,255,0.88));
            border: 1.5px solid rgba(255,255,255,0.98);
            box-shadow: 0 10px 24px rgba(14,88,128,0.18), 0 2px 5px rgba(15,23,42,0.06), inset 0 1px 0 #fff;
            line-height: 1; position: relative; isolation: isolate; overflow: hidden;
            cursor: pointer; user-select: none;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .hnb-logo:hover{
            transform: translateY(-1px); filter: brightness(1.03);
            box-shadow: 0 14px 30px rgba(14,88,128,0.24), 0 3px 8px rgba(15,23,42,0.10), inset 0 1px 0 #fff;
        }
        .hnb-logo::before{
            content: ""; position: absolute; inset: 0 0 50% 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0));
            pointer-events: none; z-index: -1;
        }
        .hnb-logo .hnb-part{
            color: #1676aa; font-weight: 900; font-size: 1.25rem;
            letter-spacing: -0.5px; text-shadow: 0 1px 0 rgba(255,255,255,0.9);
        }
        .hnb-logo .fin-part{
            color: #6fa83a; font-weight: 800; font-size: 0.72rem;
            letter-spacing: 2px; margin-left: 7px; padding-left: 8px;
            border-left: 2px solid #dbe6ef; text-shadow: 0 1px 0 rgba(255,255,255,0.9);
        }

        /* ============ LOGO POPUP ============ */
        .logo-pop{
            position: absolute; top: calc(100% + 12px); left: 0;
            z-index: 1000; width: 310px; max-width: calc(100vw - 24px);
            padding: 14px 14px 12px; border-radius: 22px;
            background: linear-gradient(150deg, rgba(255,255,255,0.94), rgba(232,243,252,0.85));
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            backdrop-filter: blur(18px) saturate(170%);
            border: 1.5px solid rgba(255,255,255,0.98);
            box-shadow: 0 22px 54px rgba(14,88,128,0.28), 0 4px 12px rgba(15,23,42,0.10), inset 0 1px 0 #fff;
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transform-origin: top left;
            transition: opacity .2s ease, transform .22s cubic-bezier(.2,.9,.3,1.2), visibility 0s linear .22s;
        }
        .logo-pop.show{
            opacity: 1; visibility: visible; pointer-events: auto;
            transform: translateY(0) scale(1);
            transition: opacity .2s ease, transform .22s cubic-bezier(.2,.9,.3,1.2), visibility 0s;
        }
        .logo-pop::before{
            content: ""; position: absolute; top: -7px; left: 22px;
            width: 14px; height: 14px;
            background: rgba(255,255,255,0.96);
            border-left: 1.5px solid rgba(255,255,255,0.98);
            border-top: 1.5px solid rgba(255,255,255,0.98);
            transform: rotate(45deg); border-radius: 3px 0 0 0;
        }
        .lp-head{
            text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 2px;
            color: #1676aa; text-transform: uppercase; margin: 0 0 10px 0;
        }
        .lp-head span{ color: #6fa83a; }
        .lp-opt{
            position: relative; isolation: isolate; overflow: hidden;
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 16px; text-decoration: none; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
            border: 1.5px solid rgba(255,255,255,0.62);
            box-shadow: 0 8px 20px rgba(14,88,128,0.28), inset 0 1.5px 0 rgba(255,255,255,0.75), inset 0 -10px 16px rgba(255,255,255,0.08);
            transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
            cursor: pointer;
        }
        .lp-opt + .lp-opt{ margin-top: 10px; }
        .lp-opt::before{
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.03));
            border-radius: inherit; border-bottom-left-radius: 60% 28%; border-bottom-right-radius: 60% 28%;
            pointer-events: none; z-index: -1;
        }
        .lp-web{
            background:
                linear-gradient(150deg,rgba(255,255,255,0.24),rgba(255,255,255,0) 60%),
                linear-gradient(160deg,rgba(22,118,170,0.96),rgba(10,84,128,0.92));
        }
        .lp-call{
            background:
                linear-gradient(150deg,rgba(255,255,255,0.26),rgba(255,255,255,0) 60%),
                linear-gradient(160deg,rgba(122,184,62,0.97),rgba(70,128,36,0.94));
            box-shadow: 0 8px 20px rgba(70,128,36,0.32), inset 0 1.5px 0 rgba(255,255,255,0.75), inset 0 -10px 16px rgba(255,255,255,0.08);
        }
        .lp-opt:hover{ transform: translateY(-2px); filter: brightness(1.08) saturate(1.1); }
        .lp-opt:active{ transform: translateY(0); filter: brightness(0.97); }
        .lp-ico{
            position: relative; flex: 0 0 42px; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            border-radius: 13px; background: rgba(255,255,255,0.24);
            border: 1px solid rgba(255,255,255,0.55);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
        }
        .lp-call .lp-ico::after{
            content: ""; position: absolute; inset: -2px; border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.7);
            animation: lpRing 1.6s ease-in-out infinite;
        }
        @keyframes lpRing{ 0%{transform:scale(1);opacity:.9} 100%{transform:scale(1.45);opacity:0} }
        .lp-call .lp-ico span{
            display: inline-block; animation: lpWiggle 2.2s ease-in-out infinite;
            transform-origin: 50% 60%;
        }
        @keyframes lpWiggle{
            0%,70%,100%{transform:rotate(0)} 75%{transform:rotate(-14deg)}
            80%{transform:rotate(12deg)} 85%{transform:rotate(-10deg)} 90%{transform:rotate(8deg)}
        }
        .lp-txt{ display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
        .lp-lbl{ font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; opacity: .92; }
        .lp-main{ font-size: 16px; font-weight: 800; letter-spacing: .3px; margin-top: 3px; white-space: nowrap; }
        .lp-go{ margin-left: auto; font-size: 22px; font-weight: 800; opacity: .9; transition: transform .18s ease; }
        .lp-opt:hover .lp-go{ transform: translateX(3px); }

        /* ============ TITLE ============ */
        .title-wrap{ min-width: 0; }
        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #1676aa, #6fa83a, #1676aa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            white-space: nowrap;
        }
        @keyframes shimmer{ to{ background-position: 200% center; } }
        .title .highlight{ color: #6fa83a; -webkit-text-fill-color: #6fa83a; }

        /* ============ HOME BUTTON (BLUE GLASS) ============ */
        .home-btn{
            isolation: isolate; overflow: hidden;
            color: #fff !important; text-decoration: none;
            padding: 10px 18px; border-radius: 40px;
            font-size: 13px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 7px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
            background:
                linear-gradient(150deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 42%, rgba(255,255,255,0) 100%),
                linear-gradient(160deg, rgba(22,118,170,0.95), rgba(10,84,128,0.90));
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            backdrop-filter: blur(14px) saturate(170%);
            border: 1.5px solid rgba(255,255,255,0.62);
            box-shadow:
                0 8px 20px rgba(14,88,128,0.28),
                0 2px 5px rgba(15,23,42,0.16),
                inset 0 1.5px 0 rgba(255,255,255,0.75),
                inset 0 -10px 16px rgba(255,255,255,0.08);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            flex-shrink: 0;
        }
        .home-btn::before{
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%;
            background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.03));
            border-radius: inherit; border-bottom-left-radius: 60% 28%; border-bottom-right-radius: 60% 28%;
            pointer-events: none; z-index: -1;
        }
        .home-btn:hover{
            filter: brightness(1.08) saturate(1.1);
            transform: translateY(-2px);
            box-shadow:
                0 14px 30px rgba(14,88,128,0.36), 0 3px 8px rgba(15,23,42,0.18),
                inset 0 1.5px 0 rgba(255,255,255,0.85), inset 0 -10px 16px rgba(255,255,255,0.10);
        }
        .home-btn:active{ transform: translateY(0); }
        .home-btn svg{ width: 16px; height: 16px; fill: currentColor; }

        .subtitle {
            font-size: 13.5px;
            color: #5d6b82;
            margin: 12px 0 24px;
            letter-spacing: 0.2px;
            font-weight: 500;
        }

        /* ============ INPUT ============ */
        .input-wrapper {
            position: relative;
            background: linear-gradient(150deg, rgba(255,255,255,0.95), rgba(255,255,255,0.72));
            border-radius: 60px;
            padding: 4px 4px 4px 22px;
            display: flex;
            align-items: center;
            border: 1.5px solid rgba(143,163,184,0.5);
            box-shadow: 0 3px 10px rgba(14,88,128,0.10), inset 0 1px 3px rgba(14,88,128,0.08);
            transition: all 0.25s ease;
        }
        .input-wrapper:focus-within {
            border-color: #1676aa;
            box-shadow: 0 0 0 4px rgba(22,118,170,0.20), 0 3px 10px rgba(14,88,128,0.12);
            transform: translateY(-1px);
        }
        .currency-label {
            font-weight: 800; font-size: 18px; color: #1676aa;
            letter-spacing: -0.3px; padding-right: 4px;
            display: flex; align-items: center; gap: 6px;
            flex-shrink: 0;
        }
        .currency-label .lkr-badge {
            font-size: 11px; font-weight: 800; color: #fff;
            background: linear-gradient(160deg, rgba(22,118,170,0.95), rgba(10,84,128,0.90));
            padding: 3px 10px; border-radius: 30px;
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
        }
        #amountInput {
            flex: 1; border: none; padding: 15px 0;
            font-size: 22px; font-weight: 700; color: #14213d;
            background: transparent; outline: none;
            font-family: 'Inter', sans-serif;
            min-width: 60px; letter-spacing: 0.3px;
        }
        #amountInput::placeholder{
            color: #8fa3b8; font-weight: 400; font-size: 18px; letter-spacing: 0;
        }

        /* ============ CONVERT BUTTON (BLUE GLASS) ============ */
        .convert-btn{
            position: relative; isolation: isolate; overflow: hidden;
            color: #fff; border: 0;
            font-weight: 700; font-size: 14.5px;
            padding: 12px 26px; border-radius: 40px;
            cursor: pointer; white-space: nowrap;
            letter-spacing: 0.3px;
            font-family: 'Inter', sans-serif;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
            background:
                linear-gradient(150deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 42%, rgba(255,255,255,0) 100%),
                linear-gradient(160deg, rgba(22,118,170,0.95), rgba(10,84,128,0.90));
            border: 1.5px solid rgba(255,255,255,0.62);
            box-shadow:
                0 8px 20px rgba(14,88,128,0.28),
                0 2px 5px rgba(15,23,42,0.16),
                inset 0 1.5px 0 rgba(255,255,255,0.75),
                inset 0 -10px 16px rgba(255,255,255,0.08);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            flex-shrink: 0;
        }
        .convert-btn::before{
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%;
            background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.03));
            border-radius: inherit; border-bottom-left-radius: 60% 28%; border-bottom-right-radius: 60% 28%;
            pointer-events: none; z-index: -1;
        }
        .convert-btn:hover{
            filter: brightness(1.08) saturate(1.1);
            transform: translateY(-2px);
            box-shadow:
                0 14px 30px rgba(14,88,128,0.36), 0 3px 8px rgba(15,23,42,0.18),
                inset 0 1.5px 0 rgba(255,255,255,0.85), inset 0 -10px 16px rgba(255,255,255,0.10);
        }
        .convert-btn:active{ transform: translateY(0); }

        /* ============ OUTPUT ============ */
        .output-area {
            margin-top: 24px;
            background: linear-gradient(150deg, rgba(255,255,255,0.94), rgba(246,251,255,0.78));
            border: 1.5px solid rgba(143,163,184,0.5);
            border-radius: 24px;
            padding: 24px 26px;
            min-height: 100px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 14px rgba(14,88,128,0.08), inset 0 1px 0 #fff;
            transition: all 0.3s ease;
        }
        .output-area:has(.result:not(.placeholder)) {
            border-color: #1676aa;
            background: linear-gradient(150deg, rgba(255,255,255,0.96), rgba(240,250,255,0.85));
            box-shadow: 0 6px 20px rgba(14,88,128,0.14), inset 0 1px 0 #fff;
        }
        .result {
            font-size: 20px; line-height: 1.55; color: #14213d;
            font-weight: 600; word-break: break-word; width: 100%;
        }
        .result .lkr-output {
            display: inline-block;
            background: linear-gradient(160deg, rgba(22,118,170,0.95), rgba(10,84,128,0.90));
            color: #fff;
            padding: 3px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.5px;
            margin-right: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
            vertical-align: middle;
        }
        .result.placeholder {
            color: #8fa3b8; font-weight: 500; font-size: 17px;
        }
        .result.placeholder .lkr-output {
            background: rgba(143,163,184,0.30);
            color: #fff;
        }
        .result:not(.placeholder) {
            animation: fadeSlide 0.25s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ FOOTER ============ */
        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            color: #5d6b82;
            padding: 0 4px;
            font-weight: 500;
        }
        .footer .hint { display: flex; align-items: center; gap: 6px; }
        .badge {
            background: linear-gradient(150deg, rgba(255,255,255,0.92), rgba(236,246,252,0.72));
            border: 1.5px solid rgba(143,163,184,0.5);
            padding: 3px 12px; border-radius: 30px;
            font-size: 10.5px; font-weight: 800;
            color: #1676aa; letter-spacing: 0.6px;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(14,88,128,0.08), inset 0 1px 0 #fff;
        }

        /* ============ EXAMPLE BUTTONS ============ */
        .examples {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .example-btn {
            background: linear-gradient(150deg, rgba(255,255,255,0.92), rgba(236,246,252,0.72));
            border: 1.5px solid rgba(143,163,184,0.5);
            padding: 7px 16px; border-radius: 30px;
            font-size: 12.5px; font-weight: 700;
            color: #14213d; cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(14,88,128,0.08), inset 0 1px 0 #fff;
        }
        .example-btn:hover{
            color: #fff;
            background:
                linear-gradient(150deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 42%, rgba(255,255,255,0) 100%),
                linear-gradient(160deg, rgba(22,118,170,0.95), rgba(10,84,128,0.90));
            border-color: rgba(255,255,255,0.62);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(14,88,128,0.26), inset 0 1px 0 rgba(255,255,255,0.7);
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }
        .example-btn:active{ transform: scale(0.97); }

        /* ============ MOBILE ============ */
        @media (max-width: 560px) {
            body { padding: 12px; }
            .card{ padding: 24px 18px 22px; border-radius: 26px; }
            .header{ flex-wrap: wrap; gap: 10px; }
            .header-left{ flex-wrap: wrap; gap: 8px; }
            .hnb-logo{ padding: 6px 12px 6px 10px; }
            .hnb-logo .hnb-part{ font-size: 1.05rem; }
            .hnb-logo .fin-part{ font-size: .62rem; letter-spacing: 1.6px; margin-left: 5px; padding-left: 6px; }
            .title{ font-size: 19px; }
            .home-btn{ padding: 8px 14px; font-size: 12px; border-radius: 30px; }
            .home-btn svg{ width: 14px; height: 14px; }
            .subtitle{ font-size: 12.5px; margin: 10px 0 18px; }
            .input-wrapper{
                flex-wrap: wrap; background: transparent; padding: 0;
                border: none; box-shadow: none; gap: 10px; border-radius: 0;
            }
            .input-wrapper:focus-within{ transform: none; box-shadow: none; }
            .currency-label{ display: none; }
            #amountInput{
                background: linear-gradient(150deg, rgba(255,255,255,0.95), rgba(255,255,255,0.72));
                padding: 15px 20px; border-radius: 40px;
                border: 1.5px solid rgba(143,163,184,0.5);
                width: 100%; font-size: 19px; text-align: center;
                box-shadow: 0 3px 10px rgba(14,88,128,0.10), inset 0 1px 3px rgba(14,88,128,0.08);
            }
            #amountInput:focus{
                border-color: #1676aa;
                box-shadow: 0 0 0 4px rgba(22,118,170,0.20), 0 3px 10px rgba(14,88,128,0.12);
            }
            .convert-btn{ width: 100%; justify-content: center; padding: 14px; font-size: 15px; border-radius: 40px; }
            .output-area{ padding: 18px 18px; min-height: 80px; border-radius: 20px; }
            .result{ font-size: 17px; }
            .result .lkr-output{ font-size: 11px; padding: 2px 10px; }
            .footer{ flex-direction: column; gap: 8px; align-items: flex-start; font-size: 12px; }
            .example-btn{ font-size: 12px; padding: 6px 13px; }
            .logo-pop{ width: 280px; padding: 12px; border-radius: 18px; }
            .lp-main{ font-size: 15px; }
            .lp-ico{ flex: 0 0 38px; width: 38px; height: 38px; font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- Header -->
        <div class="header">
            <div class="header-left">

                <!-- HNB Logo (with popup) -->
                <div class="hnb-logo-wrap" id="logoWrap">
                    <div class="hnb-logo" id="logoBtn" title="Click for website &amp; hotline">
                        <span class="hnb-part">HNB</span>
                        <span class="fin-part">FINANCE</span>
                    </div>

                    <div class="logo-pop" id="logoPop" role="dialog" aria-label="HNB Finance quick links">
                        <div class="lp-head">HNB <span>FINANCE</span></div>
                        <a class="lp-opt lp-web" href="https://www.hnbfinance.lk/" target="_blank" rel="noopener noreferrer">
                            <div class="lp-ico">🌐</div>
                            <div class="lp-txt">
                                <span class="lp-lbl">Website</span>
                                <span class="lp-main">www.hnbfinance.lk</span>
                            </div>
                            <span class="lp-go">→</span>
                        </a>
                        <a class="lp-opt lp-call" href="tel:+94114700700">
                            <div class="lp-ico"><span>📞</span></div>
                            <div class="lp-txt">
                                <span class="lp-lbl">Hotline</span>
                                <span class="lp-main">+94 11 4 700 700</span>
                            </div>
                            <span class="lp-go">→</span>
                        </a>
                    </div>
                </div>

                <div class="title-wrap">
                    <h1 class="title">LKR to <span class="highlight">Words</span></h1>
                </div>
            </div>

            <a href="https://gmaphnbf.github.io/HNBFGMAP/" class="home-btn" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Home
            </a>
        </div>
        <p class="subtitle">Convert Sri Lankan Rupees to English words</p>

        <!-- Input -->
        <div class="input-wrapper">
            <span class="currency-label">
                Rs.
                <span class="lkr-badge">LKR</span>
            </span>
            <input type="text" id="amountInput" placeholder="Enter amount..." autofocus />
            <button class="convert-btn" id="convertBtn">Convert</button>
        </div>

        <!-- Example buttons -->
        <div class="examples">
            <button class="example-btn" data-amount="150000">150,000</button>
            <button class="example-btn" data-amount="1250.75">1,250.75</button>
            <button class="example-btn" data-amount="5000">5,000</button>
            <button class="example-btn" data-amount="1000000">1,000,000</button>
        </div>

        <!-- Output -->
        <div class="output-area">
            <div class="result placeholder" id="wordOutput">
                <span class="lkr-output">LKR</span>
                Enter an amount to convert
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="hint">
                <span>⌨️</span> Type or click an example
            </div>
            <span class="badge">real-time</span>
        </div>

    </div>
</div>

<script>
    /* ==================== LOGO POPUP ==================== */
    (function(){
        const wrap = document.getElementById('logoWrap');
        const btn  = document.getElementById('logoBtn');
        const pop  = document.getElementById('logoPop');
        if(!wrap || !btn || !pop) return;
        let hideTimer = null;
        function show(){ clearTimeout(hideTimer); pop.classList.add('show'); }
        function hide(){ hideTimer = setTimeout(function(){ pop.classList.remove('show'); }, 220); }
        wrap.addEventListener('mouseenter', show);
        wrap.addEventListener('mouseleave', hide);
        btn.addEventListener('click', function(e){ e.stopPropagation(); pop.classList.toggle('show'); });
        pop.addEventListener('click', function(e){ e.stopPropagation(); });
        document.addEventListener('click', function(e){ if (!wrap.contains(e.target)) pop.classList.remove('show'); });
        document.addEventListener('keydown', function(e){ if (e.key === 'Escape') pop.classList.remove('show'); });
    })();

    (function() {
        // ---------- NUMBER TO WORDS (ENGLISH) ----------
        function numberToWords(n) {
            if (n === 0) return 'Zero';

            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
                'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const scales = ['', 'Thousand', 'Million', 'Billion', 'Trillion'];

            function helper(num) {
                if (num === 0) return '';
                if (num < 20) return ones[num] + ' ';
                if (num < 100) return tens[Math.floor(num / 10)] + ' ' + helper(num % 10);
                return ones[Math.floor(num / 100)] + ' Hundred ' + helper(num % 100);
            }

            let words = '';
            let scaleIndex = 0;
            let num = Math.floor(n);

            while (num > 0) {
                const chunk = num % 1000;
                if (chunk !== 0) {
                    const chunkWords = helper(chunk).trim();
                    words = chunkWords + (scales[scaleIndex] ? ' ' + scales[scaleIndex] + ' ' : ' ') + words;
                }
                num = Math.floor(num / 1000);
                scaleIndex++;
            }

            return words.trim();
        }

        // ---------- CONVERT AMOUNT ----------
        function convertAmount(amountStr) {
            const clean = amountStr.replace(/,/g, '').trim();

            if (clean === '') return null;

            const num = parseFloat(clean);

            if (isNaN(num) || num < 0) return 'Enter a valid amount';

            const integerPart = Math.floor(num);
            const cents = Math.round((num - integerPart) * 100);

            let result = numberToWords(integerPart);

            if (cents > 0) {
                result += ` and ${cents}/100`;
            }

            if (result.length > 0) {
                result = result.charAt(0).toUpperCase() + result.slice(1);
            }

            result += ' Rupees';

            return result || 'Zero Rupees';
        }

        // ---------- UI ----------
        const input = document.getElementById('amountInput');
        const output = document.getElementById('wordOutput');
        const convertBtn = document.getElementById('convertBtn');
        const exampleBtns = document.querySelectorAll('.example-btn');

        function updateOutput() {
            const raw = input.value;
            const converted = convertAmount(raw);

            if (converted === null) {
                output.innerHTML = `<span class="lkr-output">LKR</span> Enter an amount to convert`;
                output.classList.add('placeholder');
            } else if (converted === 'Enter a valid amount') {
                output.innerHTML = converted;
                output.classList.add('placeholder');
            } else {
                output.innerHTML = `<span class="lkr-output">LKR</span> ${converted}`;
                output.classList.remove('placeholder');
            }
        }

        input.addEventListener('input', function() {
            let val = this.value;
            val = val.replace(/[^0-9.,]/g, '');
            const parts = val.split('.');
            if (parts.length > 2) {
                val = parts[0] + '.' + parts.slice(1).join('');
            }
            this.value = val;
            updateOutput();
        });

        convertBtn.addEventListener('click', function() {
            updateOutput();
            this.textContent = '✓ Done';
            setTimeout(() => { this.textContent = 'Convert'; }, 600);
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                convertBtn.click();
            }
        });

        exampleBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const amount = this.dataset.amount;
                input.value = amount;
                updateOutput();
                input.focus();
                input.select();
            });
        });

        updateOutput();
    })();
</script>

</body>
</html>
